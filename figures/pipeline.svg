<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1000" height="540" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6470"/></marker></defs><text x="40" y="48" font-size="22" font-weight="600" fill="#1d1f24" text-anchor="start">One character folder in; every training arm scored the same way out</text><text x="40" y="74" font-size="14" font-weight="400" fill="#5d6470" text-anchor="start">Each box is a stage with its own command. A finished stage is skipped, so any run resumes.</text><rect x="40" y="112" width="160" height="62" rx="8" fill="#2e7d5b" fill-opacity="0.1" stroke="#2e7d5b" stroke-width="1.25"/><rect x="40" y="112" width="160" height="62" rx="8" fill="none" stroke="#2e7d5b" stroke-width="1.25"/><text x="120.0" y="138" font-size="14" font-weight="600" fill="#1d1f24" text-anchor="middle">Character folder</text><text x="120.0" y="158" font-size="12" font-weight="400" fill="#5d6470" text-anchor="middle">bible · rules · scenarios</text><rect x="230" y="112" width="160" height="62" rx="8" fill="#2e7d5b" fill-opacity="0.1" stroke="#2e7d5b" stroke-width="1.25"/><rect x="230" y="112" width="160" height="62" rx="8" fill="none" stroke="#2e7d5b" stroke-width="1.25"/><text x="310.0" y="138" font-size="14" font-weight="600" fill="#1d1f24" text-anchor="middle">Teacher</text><text x="310.0" y="158" font-size="12" font-weight="400" fill="#5d6470" text-anchor="middle">writes chats</text><rect x="420" y="112" width="160" height="62" rx="8" fill="#c2412d" fill-opacity="0.1" stroke="#c2412d" stroke-width="2.5"/><rect x="420" y="112" width="160" height="62" rx="8" fill="none" stroke="#c2412d" stroke-width="2.5"/><text x="500.0" y="138" font-size="14" font-weight="600" fill="#1d1f24" text-anchor="middle">Checker</text><text x="500.0" y="158" font-size="12" fon